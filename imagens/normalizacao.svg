<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" style="background-color: #0f171c; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Seta limpa e profissional para o fluxo -->
    <marker id="seta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- ================= BLOCO 1: 1FN ================= -->
  <g transform="translate(30, 25)">
    <!-- Fundo do card -->
    <rect x="0" y="0" width="275" height="330" rx="12" fill="#152229" stroke="#243844" stroke-width="1.5"/>
    
    <!-- Tag da 1FN -->
    <rect x="20" y="20" width="55" height="26" rx="6" fill="#00dc82"/>
    <text x="47" y="37" fill="#090d10" font-size="12" font-weight="800" text-anchor="middle">1FN</text>
    
    <text x="85" y="38" fill="#f0f6f9" font-size="15" font-weight="700">Valores Atômicos</text>
    
    <!-- Caixa interna de tabela (esquema relacional) -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="235" height="185" rx="8" fill="#090d10" stroke="#243844"/>
      
      <!-- Cabeçalho da tabela -->
      <rect x="0" y="0" width="235" height="30" rx="8" fill="#152229"/>
      <text x="12" y="20" fill="#00dc82" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">id_perg</text>
      <text x="85" y="20" fill="#f0f6f9" font-family="JetBrains Mono, monospace" font-size="10">enunciado</text>
      <text x="165" y="20" fill="#f0f6f9" font-family="JetBrains Mono, monospace" font-size="10">alternativa</text>
      
      <line x1="0" y1="30" x2="235" y2="30" stroke="#243844" stroke-width="1"/>
      
      <!-- Linhas de dados -->
      <text x="12" y="52" fill="#627b87" font-family="JetBrains Mono, monospace" font-size="10">1</text>
      <text x="85" y="52" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="10">Python?</text>
      <text x="165" y="52" fill="#00dc82" font-family="JetBrains Mono, monospace" font-size="10">A) Sim</text>
      
      <line x1="0" y1="65" x2="235" y2="65" stroke="#243844" stroke-width="0.5" stroke-dasharray="2,2"/>
      
      <text x="12" y="85" fill="#627b87" font-family="JetBrains Mono, monospace" font-size="10">1</text>
      <text x="85" y="85" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="10">Python?</text>
      <text x="165" y="85" fill="#00dc82" font-family="JetBrains Mono, monospace" font-size="10">B) Não</text>
      
      <line x1="0" y1="98" x2="235" y2="98" stroke="#243844" stroke-width="0.5" stroke-dasharray="2,2"/>
      
      <text x="12" y="118" fill="#627b87" font-family="JetBrains Mono, monospace" font-size="10">2</text>
      <text x="85" y="118" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="10">HTML?</text>
      <text x="165" y="118" fill="#00dc82" font-family="JetBrains Mono, monospace" font-size="10">A) Certo</text>
    </g>

    <!-- Rodapé descritivo -->
    <text x="20" y="280" fill="#9cb1bc" font-size="11" font-weight="500">Sem listas compostas ou vetores</text>
    <text x="20" y="298" fill="#627b87" font-size="10">em uma mesma célula de dados.</text>
  </g>

  <!-- Seta de transição 1 -> 2 -->
  <line x1="320" y1="190" x2="345" y2="190" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- ================= BLOCO 2: 2FN ================= -->
  <g transform="translate(355, 25)">
    <!-- Fundo do card -->
    <rect x="0" y="0" width="275" height="330" rx="12" fill="#152229" stroke="#243844" stroke-width="1.5"/>
    
    <!-- Tag da 2FN -->
    <rect x="20" y="20" width="55" height="26" rx="6" fill="#38bdf8"/>
    <text x="47" y="37" fill="#090d10" font-size="12" font-weight="800" text-anchor="middle">2FN</text>
    
    <text x="85" y="38" fill="#f0f6f9" font-size="15" font-weight="700">Dependência Total</text>
    
    <!-- Caixa interna -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="235" height="185" rx="8" fill="#090d10" stroke="#243844"/>
      
      <!-- Tabela 1 -->
      <rect x="12" y="15" width="211" height="65" rx="6" fill="#152229" stroke="#243844"/>
      <text x="22" y="33" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">PK: (id_pergunta, id_alternativa)</text>
      <text x="22" y="55" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="10">resposta_correta (boolean)</text>
      
      <!-- Linha de relação -->
      <line x1="117" y1="80" x2="117" y2="98" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
      
      <!-- Tabela 2 -->
      <rect x="12" y="98" width="211" height="65" rx="6" fill="#152229" stroke="#243844"/>
      <text x="22" y="116" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">PK: id_pergunta</text>
      <text x="22" y="138" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="10">enunciado_texto</text>
    </g>

    <!-- Rodapé descritivo -->
    <text x="20" y="280" fill="#9cb1bc" font-size="11" font-weight="500">Elimina dependências parciais</text>
    <text x="20" y="298" fill="#627b87" font-size="10">de frações de chaves compostas.</text>
  </g>

  <!-- Seta de transição 2 -> 3 -->
  <line x1="645" y1="190" x2="670" y2="190" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#seta)"/>

  <!-- ================= BLOCO 3: 3FN ================= -->
  <g transform="translate(680, 25)">
    <!-- Fundo do card -->
    <rect x="0" y="0" width="250" height="330" rx="12" fill="#152229" stroke="#243844" stroke-width="1.5"/>
    
    <!-- Tag da 3FN -->
    <rect x="20" y="20" width="55" height="26" rx="6" fill="#f59e0b"/>
    <text x="47" y="37" fill="#090d10" font-size="12" font-weight="800" text-anchor="middle">3FN</text>
    
    <text x="85" y="38" fill="#f0f6f9" font-size="15" font-weight="700">Sem Transitiva</text>
    
    <!-- Caixa interna com entidades separadas -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="210" height="185" rx="8" fill="#090d10" stroke="#243844"/>
      
      <!-- Entidade 1 -->
      <rect x="15" y="15" width="180" height="42" rx="5" fill="#152229" stroke="#243844"/>
      <text x="25" y="32" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">perguntas</text>
      <text x="25" y="46" fill="#627b87" font-family="JetBrains Mono, monospace" font-size="9">FK: id_categoria, id_fonte</text>
      
      <!-- Seta FK -->
      <line x1="105" y1="57" x2="105" y2="73" stroke="#f59e0b" stroke-width="1.5"/>
      
      <!-- Entidade 2 e 3 -->
      <rect x="15" y="73" width="180" height="42" rx="5" fill="#152229" stroke="#243844"/>
      <text x="25" y="90" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">fontes / categorias</text>
      <text x="25" y="104" fill="#627b87" font-family="JetBrains Mono, monospace" font-size="9">PK dedicada por tabela</text>

      <text x="25" y="145" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="9">Atributos não-chave</text>
      <text x="25" y="158" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="9">isolados em tabelas-filha.</text>
    </g>

    <!-- Rodapé descritivo -->
    <text x="20" y="280" fill="#9cb1bc" font-size="11" font-weight="500">Isolamento de dependências</text>
    <text x="20" y="298" fill="#627b87" font-size="10">entre atributos não-chave.</text>
  </g>
</svg>
