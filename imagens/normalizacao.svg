<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" height="100%" style="background-color: #0f171c; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Seta limpa e destacada para o fluxo -->
    <marker id="seta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- ================= BLOCO 1: 1FN ================= -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="275" height="350" rx="12" fill="#152229" stroke="#2e4757" stroke-width="2"/>
    
    <!-- Tag da 1FN -->
    <rect x="20" y="20" width="58" height="28" rx="6" fill="#00dc82"/>
    <text x="49" y="39" fill="#090d10" font-size="13" font-weight="900" text-anchor="middle">1FN</text>
    
    <text x="90" y="39" fill="#ffffff" font-size="16" font-weight="700">Valores Atômicos</text>
    
    <!-- Caixa interna de tabela -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="235" height="195" rx="8" fill="#090d10" stroke="#2e4757"/>
      
      <!-- Cabeçalho -->
      <rect x="0" y="0" width="235" height="34" rx="8" fill="#152229"/>
      <text x="12" y="22" fill="#00dc82" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">id_perg</text>
      <text x="85" y="22" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">enunciado</text>
      <text x="165" y="22" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">alt</text>
      
      <line x1="0" y1="34" x2="235" y2="34" stroke="#2e4757" stroke-width="1"/>
      
      <!-- Linhas de dados com texto maior e mais claro -->
      <text x="12" y="58" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">1</text>
      <text x="85" y="58" fill="#f0f6f9" font-family="JetBrains Mono, monospace" font-size="11">Python?</text>
      <text x="165" y="58" fill="#00dc82" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">A) Sim</text>
      
      <line x1="0" y1="74" x2="235" y2="74" stroke="#2e4757" stroke-width="1" stroke-dasharray="2,2"/>
      
      <text x="12" y="98" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">1</text>
      <text x="85" y="98" fill="#f0f6f9" font-family="JetBrains Mono, monospace" font-size="11">Python?</text>
      <text x="165" y="98" fill="#00dc82" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">B) Não</text>
      
      <line x1="0" y1="114" x2="235" y2="114" stroke="#2e4757" stroke-width="1" stroke-dasharray="2,2"/>
      
      <text x="12" y="138" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">2</text>
      <text x="85" y="138" fill="#f0f6f9" font-family="JetBrains Mono, monospace" font-size="11">HTML?</text>
      <text x="165" y="138" fill="#00dc82" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">A) Certo</text>
    </g>

    <!-- Rodapé descritivo -->
    <text x="20" y="295" fill="#f0f6f9" font-size="12" font-weight="600">Sem listas compostas ou vetores</text>
    <text x="20" y="316" fill="#9cb1bc" font-size="11">em uma mesma célula de dados.</text>
  </g>

  <!-- Seta 1 -> 2 -->
  <line x1="320" y1="195" x2="345" y2="195" stroke="#38bdf8" stroke-width="3" marker-end="url(#seta)"/>

  <!-- ================= BLOCO 2: 2FN ================= -->
  <g transform="translate(355, 20)">
    <rect x="0" y="0" width="275" height="350" rx="12" fill="#152229" stroke="#2e4757" stroke-width="2"/>
    
    <!-- Tag da 2FN -->
    <rect x="20" y="20" width="58" height="28" rx="6" fill="#38bdf8"/>
    <text x="49" y="39" fill="#090d10" font-size="13" font-weight="900" text-anchor="middle">2FN</text>
    
    <text x="90" y="39" fill="#ffffff" font-size="16" font-weight="700">Dependência Total</text>
    
    <!-- Caixa interna -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="235" height="195" rx="8" fill="#090d10" stroke="#2e4757"/>
      
      <!-- Tabela 1 -->
      <rect x="12" y="16" width="211" height="68" rx="6" fill="#152229" stroke="#2e4757"/>
      <text x="20" y="36" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">PK: (id_perg, id_alternativa)</text>
      <text x="20" y="60" fill="#f0f6f9" font-family="JetBrains Mono, monospace" font-size="11">resposta_correta</text>
      
      <!-- Linha de relação -->
      <line x1="117" y1="84" x2="117" y2="104" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
      
      <!-- Tabela 2 -->
      <rect x="12" y="104" width="211" height="68" rx="6" fill="#152229" stroke="#2e4757"/>
      <text x="20" y="124" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">PK: id_pergunta</text>
      <text x="20" y="148" fill="#f0f6f9" font-family="JetBrains Mono, monospace" font-size="11">enunciado_texto</text>
    </g>

    <!-- Rodapé descritivo -->
    <text x="20" y="295" fill="#f0f6f9" font-size="12" font-weight="600">Elimina dependências parciais</text>
    <text x="20" y="316" fill="#9cb1bc" font-size="11">de frações de chaves compostas.</text>
  </g>

  <!-- Seta 2 -> 3 -->
  <line x1="645" y1="195" x2="670" y2="195" stroke="#f59e0b" stroke-width="3" marker-end="url(#seta)"/>

  <!-- ================= BLOCO 3: 3FN ================= -->
  <g transform="translate(680, 20)">
    <rect x="0" y="0" width="250" height="350" rx="12" fill="#152229" stroke="#2e4757" stroke-width="2"/>
    
    <!-- Tag da 3FN -->
    <rect x="20" y="20" width="58" height="28" rx="6" fill="#f59e0b"/>
    <text x="49" y="39" fill="#090d10" font-size="13" font-weight="900" text-anchor="middle">3FN</text>
    
    <text x="90" y="39" fill="#ffffff" font-size="16" font-weight="700">Sem Transitiva</text>
    
    <!-- Caixa interna com entidades separadas -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="210" height="195" rx="8" fill="#090d10" stroke="#2e4757"/>
      
      <!-- Entidade 1 -->
      <rect x="15" y="16" width="180" height="46" rx="6" fill="#152229" stroke="#2e4757"/>
      <text x="22" y="34" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">perguntas</text>
      <text x="22" y="50" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="10">FK: id_cat, id_fonte</text>
      
      <!-- Seta FK -->
      <line x1="105" y1="62" x2="105" y2="78" stroke="#f59e0b" stroke-width="2"/>
      
      <!-- Entidade 2 -->
      <rect x="15" y="78" width="180" height="46" rx="6" fill="#152229" stroke="#2e4757"/>
      <text x="22" y="96" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">fontes / categorias</text>
      <text x="22" y="112" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="10">PK dedicada por tabela</text>

      <text x="22" y="152" fill="#f0f6f9" font-family="JetBrains Mono, monospace" font-size="11">Atributos não-chave</text>
      <text x="22" y="170" fill="#9cb1bc" font-family="JetBrains Mono, monospace" font-size="11">isolados em tabelas-filha.</text>
    </g>

    <!-- Rodapé descritivo -->
    <text x="20" y="295" fill="#f0f6f9" font-size="12" font-weight="600">Isolamento de dependências</text>
    <text x="20" y="316" fill="#9cb1bc" font-size="11">entre atributos não-chave.</text>
  </g>
</svg>
