<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="100%" height="100%" style="background-color: #090d10; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradientes de Fundo dos Cards -->
    <linearGradient id="grad-1fn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00dc82" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#152229" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="grad-2fn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#152229" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="grad-3fn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#152229" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Marcador de Seta -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- ================= ETAPA 1: 1FN ================= -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="280" height="360" rx="16" fill="url(#grad-1fn)" stroke="#00dc82" stroke-width="2"/>
    
    <!-- Tag Pill -->
    <rect x="24" y="24" width="64" height="28" rx="14" fill="#00dc82"/>
    <text x="56" y="43" fill="#090d10" font-size="13" font-weight="800" text-anchor="middle">1FN</text>
    
    <!-- Títulos -->
    <text x="24" y="82" fill="#f0f6f9" font-size="19" font-weight="700">Valores Atômicos</text>
    <text x="24" y="105" fill="#9cb1bc" font-size="12" font-weight="400">Remove grupos repetitivos e vetores</text>

    <!-- Bloco de Visualização Interna -->
    <g transform="translate(24, 125)">
      <rect x="0" y="0" width="232" height="135" rx="8" fill="#0f171c" stroke="#243844"/>
      <rect x="0" y="0" width="232" height="32" rx="8" fill="#152229"/>
      <text x="14" y="21" fill="#00dc82" font-size="11" font-weight="700">ID</text>
      <text x="55" y="21" fill="#f0f6f9" font-size="11" font-weight="600">Pergunta</text>
      <text x="150" y="21" fill="#f0f6f9" font-size="11" font-weight="600">Alternativa</text>
      
      <line x1="0" y1="32" x2="232" y2="32" stroke="#243844" stroke-width="1"/>
      <text x="14" y="56" fill="#627b87" font-size="11" font-weight="600">1</text>
      <text x="55" y="56" fill="#9cb1bc" font-size="11">Python...</text>
      <text x="150" y="56" fill="#00dc82" font-size="11">A) Sim</text>
      
      <line x1="0" y1="68" x2="232" y2="68" stroke="#243844" stroke-width="1"/>
      <text x="14" y="92" fill="#627b87" font-size="11" font-weight="600">1</text>
      <text x="55" y="92" fill="#9cb1bc" font-size="11">Python...</text>
      <text x="150" y="92" fill="#00dc82" font-size="11">B) Não</text>

      <line x1="0" y1="104" x2="232" y2="104" stroke="#243844" stroke-width="1"/>
      <text x="14" y="121" fill="#627b87" font-size="11" font-weight="600">2</text>
      <text x="55" y="121" fill="#9cb1bc" font-size="11">HTML...</text>
      <text x="150" y="121" fill="#00dc82" font-size="11">A) Certo</text>
    </g>

    <!-- Footer do Card -->
    <rect x="24" y="278" width="232" height="46" rx="8" fill="#0f171c" stroke="#243844"/>
    <text x="36" y="306" fill="#00dc82" font-size="11.5" font-weight="600">✓ Dados indivisíveis por célula</text>
  </g>

  <!-- SETA 1 -> 2 -->
  <path d="M 324 210 L 358 210" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ================= ETAPA 2: 2FN ================= -->
  <g transform="translate(370, 30)">
    <rect x="0" y="0" width="280" height="360" rx="16" fill="url(#grad-2fn)" stroke="#38bdf8" stroke-width="2"/>
    
    <!-- Tag Pill -->
    <rect x="24" y="24" width="64" height="28" rx="14" fill="#38bdf8"/>
    <text x="56" y="43" fill="#090d10" font-size="13" font-weight="800" text-anchor="middle">2FN</text>
    
    <!-- Títulos -->
    <text x="24" y="82" fill="#f0f6f9" font-size="19" font-weight="700">Dependência Total</text>
    <text x="24" y="105" fill="#9cb1bc" font-size="12" font-weight="400">Elimina dependências parciais de chave</text>

    <!-- Bloco de Visualização Interna -->
    <g transform="translate(24, 125)">
      <rect x="0" y="0" width="232" height="58" rx="8" fill="#0f171c" stroke="#243844"/>
      <rect x="0" y="0" width="232" height="24" rx="8" fill="#152229"/>
      <text x="12" y="16" fill="#38bdf8" font-size="10.5" font-weight="700">Chave Composta: (Perg, Alt)</text>
      <text x="12" y="44" fill="#9cb1bc" font-size="11">Atributo depende da chave inteira</text>
      
      <!-- Linha de decomposição -->
      <path d="M 116 58 L 116 72" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

      <rect x="0" y="72" width="232" height="58" rx="8" fill="#0f171c" stroke="#243844"/>
      <rect x="0" y="72" width="232" height="24" rx="8" fill="#152229"/>
      <text x="12" y="88" fill="#38bdf8" font-size="10.5" font-weight="700">Tabelas Separadas</text>
      <text x="12" y="116" fill="#9cb1bc" font-size="11">Sem dependência parcial</text>
    </g>

    <!-- Footer do Card -->
    <rect x="24" y="278" width="232" height="46" rx="8" fill="#0f171c" stroke="#243844"/>
    <text x="36" y="306" fill="#38bdf8" font-size="11.5" font-weight="600">✓ Atributo ligado à chave inteira</text>
  </g>

  <!-- SETA 2 -> 3 -->
  <path d="M 664 210 L 698 210" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ================= ETAPA 3: 3FN ================= -->
  <g transform="translate(710, 30)">
    <rect x="0" y="0" width="260" height="360" rx="16" fill="url(#grad-3fn)" stroke="#f59e0b" stroke-width="2"/>
    
    <!-- Tag Pill -->
    <rect x="24" y="24" width="64" height="28" rx="14" fill="#f59e0b"/>
    <text x="56" y="43" fill="#090d10" font-size="13" font-weight="800" text-anchor="middle">3FN</text>
    
    <!-- Títulos -->
    <text x="24" y="82" fill="#f0f6f9" font-size="19" font-weight="700">Isolamento Total</text>
    <text x="24" y="105" fill="#9cb1bc" font-size="12" font-weight="400">Elimina dependências transitivas</text>

    <!-- Bloco de Visualização Interna -->
    <g transform="translate(24, 125)">
      <rect x="0" y="0" width="212" height="36" rx="6" fill="#0f171c" stroke="#243844"/>
      <text x="12" y="23" fill="#f0f6f9" font-size="11" font-weight="700">perguntas</text>
      <text x="115" y="23" fill="#f59e0b" font-size="10.5" font-weight="600">FK: id_fonte</text>

      <path d="M 106 36 L 106 48" stroke="#f59e0b" stroke-width="1.5"/>

      <rect x="0" y="48" width="212" height="36" rx="6" fill="#0f171c" stroke="#243844"/>
      <text x="12" y="71" fill="#f59e0b" font-size="11" font-weight="700">fontes</text>
      <text x="95" y="71" fill="#9cb1bc" font-size="10">nome, url</text>

      <path d="M 106 84 L 106 96" stroke="#f59e0b" stroke-width="1.5"/>

      <rect x="0" y="96" width="212" height="36" rx="6" fill="#0f171c" stroke="#243844"/>
      <text x="12" y="119" fill="#f59e0b" font-size="11" font-weight="700">categorias</text>
      <text x="110" y="119" fill="#9cb1bc" font-size="10">nome</text>
    </g>

    <!-- Footer do Card -->
    <rect x="24" y="278" width="212" height="46" rx="8" fill="#0f171c" stroke="#243844"/>
    <text x="32" y="306" fill="#f59e0b" font-size="11.5" font-weight="600">✓ Sem atributos encadeados</text>
  </g>
</svg>
