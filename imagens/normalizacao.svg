<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" style="background-color: #090d10; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Seta de alta visibilidade -->
    <marker id="seta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- ================= BLOCO 1: 1FN ================= -->
  <g transform="translate(30, 25)">
    <!-- Fundo do card -->
    <rect x="0" y="0" width="275" height="330" rx="12" fill="#121c23" stroke="#334e5e" stroke-width="2"/>
    
    <!-- Tag da 1FN (Alto Contraste) -->
    <rect x="20" y="20" width="55" height="26" rx="6" fill="#00dc82"/>
    <text x="47" y="37" fill="#05080a" font-size="12" font-weight="900" text-anchor="middle">1FN</text>
    
    <text x="85" y="38" fill="#ffffff" font-size="15" font-weight="800">Valores Atômicos</text>
    
    <!-- Caixa interna de tabela -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="235" height="185" rx="8" fill="#090d10" stroke="#334e5e"/>
      
      <!-- Cabeçalho da tabela -->
      <rect x="0" y="0" width="235" height="30" rx="8" fill="#152229"/>
      <text x="12" y="20" fill="#00dc82" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800">id_perg</text>
      <text x="85" y="20" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">enunciado</text>
      <text x="165" y="20" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">alternativa</text>
      
      <line x1="0" y1="30" x2="235" y2="30" stroke="#334e5e" stroke-width="1"/>
      
      <!-- Linhas de dados com texto branco/claro de alto contraste -->
      <text x="12" y="52" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">1</text>
      <text x="85" y="52" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="11">Python?</text>
      <text x="165" y="52" fill="#00dc82" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">A) Sim</text>
      
      <line x1="0" y1="65" x2="235" y2="65" stroke="#334e5e" stroke-width="0.5" stroke-dasharray="2,2"/>
      
      <text x="12" y="85" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">1</text>
      <text x="85" y="85" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="11">Python?</text>
      <text x="165" y="85" fill="#00dc82" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">B) Não</text>
      
      <line x1="0" y1="98" x2="235" y2="98" stroke="#334e5e" stroke-width="0.5" stroke-dasharray="2,2"/>
      
      <text x="12" y="118" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">2</text>
      <text x="85" y="118" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="11">HTML?</text>
      <text x="165" y="118" fill="#00dc82" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700">A) Certo</text>
    </g>

    <!-- Rodapé descritivo com alta legibilidade -->
    <text x="20" y="278" fill="#ffffff" font-size="11" font-weight="700">Sem listas compostas ou vetores</text>
    <text x="20" y="296" fill="#cbd5e1" font-size="10.5">em uma mesma célula de dados.</text>
  </g>

  <!-- Seta de transição 1 -> 2 -->
  <line x1="320" y1="190" x2="345" y2="190" stroke="#38bdf8" stroke-width="3" marker-end="url(#seta)"/>

  <!-- ================= BLOCO 2: 2FN ================= -->
  <g transform="translate(355, 25)">
    <!-- Fundo do card -->
    <rect x="0" y="0" width="275" height="330" rx="12" fill="#121c23" stroke="#334e5e" stroke-width="2"/>
    
    <!-- Tag da 2FN -->
    <rect x="20" y="20" width="55" height="26" rx="6" fill="#38bdf8"/>
    <text x="47" y="37" fill="#05080a" font-size="12" font-weight="900" text-anchor="middle">2FN</text>
    
    <text x="85" y="38" fill="#ffffff" font-size="15" font-weight="800">Dependência Total</text>
    
    <!-- Caixa interna -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="235" height="185" rx="8" fill="#090d10" stroke="#334e5e"/>
      
      <!-- Tabela 1 -->
      <rect x="12" y="15" width="211" height="65" rx="6" fill="#152229" stroke="#334e5e"/>
      <text x="22" y="33" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="800">PK: (id_perg, id_alternativa)</text>
      <text x="22" y="55" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="10.5">resposta_correta (boolean)</text>
      
      <!-- Linha de relação -->
      <line x1="117" y1="80" x2="117" y2="98" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
      
      <!-- Tabela 2 -->
      <rect x="12" y="98" width="211" height="65" rx="6" fill="#152229" stroke="#334e5e"/>
      <text x="22" y="116" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="800">PK: id_pergunta</text>
      <text x="22" y="138" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="10.5">enunciado_texto</text>
    </g>

    <!-- Rodapé descritivo -->
    <text x="20" y="278" fill="#ffffff" font-size="11" font-weight="700">Elimina dependências parciais</text>
    <text x="20" y="296" fill="#cbd5e1" font-size="10.5">de frações de chaves compostas.</text>
  </g>

  <!-- Seta de transição 2 -> 3 -->
  <line x1="645" y1="190" x2="670" y2="190" stroke="#f59e0b" stroke-width="3" marker-end="url(#seta)"/>

  <!-- ================= BLOCO 3: 3FN ================= -->
  <g transform="translate(680, 25)">
    <!-- Fundo do card -->
    <rect x="0" y="0" width="250" height="330" rx="12" fill="#121c23" stroke="#334e5e" stroke-width="2"/>
    
    <!-- Tag da 3FN -->
    <rect x="20" y="20" width="55" height="26" rx="6" fill="#f59e0b"/>
    <text x="47" y="37" fill="#05080a" font-size="12" font-weight="900" text-anchor="middle">3FN</text>
    
    <text x="85" y="38" fill="#ffffff" font-size="15" font-weight="800">Sem Transitiva</text>
    
    <!-- Caixa interna com entidades separadas -->
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="210" height="185" rx="8" fill="#090d10" stroke="#334e5e"/>
      
      <!-- Entidade 1 -->
      <rect x="15" y="15" width="180" height="42" rx="5" fill="#152229" stroke="#334e5e"/>
      <text x="25" y="32" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="800">perguntas</text>
      <text x="25" y="46" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="9.5">FK: id_cat, id_fonte</text>
      
      <!-- Seta FK -->
      <line x1="105" y1="57" x2="105" y2="73" stroke="#f59e0b" stroke-width="2"/>
      
      <!-- Entidade 2 e 3 -->
      <rect x="15" y="73" width="180" height="42" rx="5" fill="#152229" stroke="#334e5e"/>
      <text x="25" y="90" fill="#f59e0b" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="800">fontes / categorias</text>
      <text x="25" y="104" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="9.5">PK dedicada por tabela</text>

      <text x="25" y="145" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="10">Atributos não-chave</text>
      <text x="25" y="158" fill="#cbd5e1" font-family="JetBrains Mono, monospace" font-size="10">isolados em tabelas-filha.</text>
    </g>

    <!-- Rodapé descritivo -->
    <text x="20" y="278" fill="#ffffff" font-size="11" font-weight="700">Isolamento de dependências</text>
    <text x="20" y="296" fill="#cbd5e1" font-size="10.5">entre atributos não-chave.</text>
    </g>
</svg>
